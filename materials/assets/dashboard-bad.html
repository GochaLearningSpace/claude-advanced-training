<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>MiniTask Dashboard</title>
<!--
  BAD EXAMPLE — 3. Artifacts + Design セクションの講評用サンプル。
  意図的に「いかにもAI生成」なパターンを詰め込んである。講評で指摘するポイント:
    1. 紫→青のグラデーションヒーロー(テンプレ感の代表格)
    2. "Inter" 決め打ち(埋め込みなし、フォールバックが何になるか未確認のまま指定)
    3. 絵文字を見出しの装飾として多用(📊✅📝🎯)
    4. 全部中央揃え、情報の優先順位が視覚的に一切ない(総数もタスク一覧も同じ扱い)
    5. カードは角丸+重いドロップシャドウ、罫線の代わりに影で区切りを表現
    6. ライト/ダーク対応なし(prefers-color-scheme 未実装)
    7. 進捗バーがグラデーション、完了/未完了の意味色ではなく装飾優先
    8. 完了タスクを単に薄いグレーにしただけで、視覚的な意味づけ(取り消し線等)がない
-->
<style>
  body {
    margin: 0;
    padding: 3rem 1rem;
    background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
    font-family: "Inter", sans-serif;
    text-align: center;
  }

  .card {
    max-width: 480px;
    margin: 0 auto 1.5rem;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 2rem;
  }

  h1 {
    font-size: 1.8rem;
    color: #333;
  }

  .stat {
    font-size: 2rem;
    font-weight: bold;
    color: #7c3aed;
  }

  .progress-bar {
    width: 100%;
    height: 20px;
    border-radius: 10px;
    background: #eee;
    overflow: hidden;
    margin: 1rem 0;
  }
  .progress-fill {
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    border-radius: 10px;
  }

  ul {
    list-style: none;
    padding: 0;
    text-align: left;
  }
  li {
    padding: 0.6rem;
    border-radius: 12px;
    background: #f9fafb;
    margin-bottom: 0.5rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  li.done { color: #aaa; }
</style>
</head>
<body>
  <div class="card">
    <h1>📊 MiniTask Dashboard</h1>
    <div class="stat">50%</div>
    <p>タスクの進捗状況です ✨</p>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>

  <div class="card">
    <h1>📝 タスク一覧</h1>
    <ul>
      <li class="done">✅ Claude Code にログインする</li>
      <li class="done">✅ 共通サンプルを clone する</li>
      <li>🎯 Harness Engineering の演習をやる</li>
      <li>🎯 Security チェックリストを適用する</li>
    </ul>
  </div>
</body>
</html>
